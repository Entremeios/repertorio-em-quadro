<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Repertório em Quadro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #27233a;
    }

    /* CABEÇALHO */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e8e4f5;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: bold;
      color: #6547d9;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #6547d9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .entrar {
      border: none;
      background: #6547d9;
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTEÚDO PRINCIPAL */

    main {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 55px 0;
    }

    .boas-vindas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      margin-bottom: 45px;
    }

    .texto h1 {
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .texto h1 span {
      color: #6547d9;
    }

    .texto p {
      color: #706b82;
      font-size: 17px;
      line-height: 1.6;
      max-width: 650px;
    }

    .adicionar {
      background: #6547d9;
      color: white;
      border: none;
      padding: 15px 23px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(101, 71, 217, 0.20);
    }

    .adicionar:hover,
    .entrar:hover {
      opacity: 0.9;
    }

    /* BARRA DE PESQUISA */

    .ferramentas {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 28px;
      box-shadow: 0 5px 20px rgba(40, 30, 80, 0.06);
    }

    .pesquisa {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e4e0ef;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: #faf9fd;
    }

    .categorias {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .categoria {
      border: none;
      background: #f0edfb;
      color: #6256a0;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .categoria.ativa {
      background: #6547d9;
      color: white;
    }

    /* QUADRO */

    .titulo-quadro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 35px 0 18px;
    }

    .titulo-quadro h2 {
      font-size: 23px;
    }

    .titulo-quadro span {
      color: #817b92;
      font-size: 14px;
    }

    .quadro {
      columns: 4 230px;
      column-gap: 18px;
    }

    /* CARDS */

    .card {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      margin-bottom: 18px;
      break-inside: avoid;
      box-shadow: 0 5px 18px rgba(40, 30, 80, 0.08);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(40, 30, 80, 0.13);
    }

    .imagem {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .conteudo-card {
      padding: 17px;
    }

    .conteudo-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }
