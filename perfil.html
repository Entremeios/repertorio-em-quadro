<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil | Biblioteca Virtual Gonçalves Dias</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #eee8d9;
    color: #17251b;
    font-family: Georgia, serif;
}

header {
    background: #536b4d;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
}

header a {
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 70px 25px;
}

.perfil {
    background: #f7f5ed;
    border: 1px solid #d4d0c4;
    padding: 45px;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 45px;
}

.avatar {
    width: 150px;
    height: 150px;
    background: #536b4d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 55px;
}

h1 {
    font-size: 45px;
    font-weight: normal;
    margin-bottom: 10px;
}

.info {
    font-family: Arial, sans-serif;
    color: #666;
    line-height: 1.8;
}

.acoes {
    margin-top: 35px;
}

.acoes a {
    display: inline-block;
    background: #536b4d;
    color: white;
    padding: 13px 20px;
    text-decoration: none;
    font-family: Arial, sans-serif;
    margin-right: 10px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-family: Arial, sans-serif;
}

@media(max-width:650px) {
    .perfil {
        grid-template-columns: 1fr;
        text-align: center;
    }

    .avatar {
        margin: auto;
    }
}
</style>
</head>

<body>

<header>
<strong>📖 Biblioteca Virtual Gonçalves Dias</strong>
<a href="index.html">← Início</a>
</header>

<main>

<div class="perfil">

<div class="avatar">
📖
</div>

<div>

<h1>Meu Perfil</h1>

<p class="info">
Entre na sua conta para acompanhar suas leituras,
cadernos e descobertas dentro da biblioteca.
</p>

<div class="acoes">
<a href="login.html">Entrar</a>
<a href="estante.html">Minha estante</a>
</div>

</div>

</div>

</main>

<footer>
Biblioteca Virtual Gonçalves Dias
</footer>

</body>
</html>
